<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="キリリンSHOP" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>キリリンSHOP</title>
  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: #333;
      --accent: #f0a500;
      --accent2: #e06b00;
      --green: #3ecf8e;
      --red: #f06060;
      --blue: #5b9cf6;
      --text: #f0f0f0;
      --text2: #aaa;
      --text3: #666;
      --radius: 14px;
      --radius-sm: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { background: var(--bg); color: var(--text); font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 16px; }
    body { min-height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; overflow-x: hidden; }
    button { border: none; background: none; color: inherit; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    input, select, textarea { font: inherit; color: inherit; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--bg3); }
    img { display: block; max-width: 100%; }

    /* ===== HEADER ===== */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 14px 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
      padding-top: max(14px, env(safe-area-inset-top, 14px));
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg3); display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    /* ===== TAB NAV ===== */
    .tab-nav {
      display: flex; background: var(--bg2); border-bottom: 1px solid var(--border);
      position: sticky; top: 57px; z-index: 99;
    }
    .tab-nav button {
      flex: 1; padding: 10px 4px; font-size: 12px; color: var(--text2);
      border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
    }
    .tab-nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ===== MAIN ===== */
    .page { display: none; padding: 16px 16px calc(100px + var(--safe-bottom)); }
    .page.active { display: block; }

    /* ===== DASHBOARD ===== */
    .month-selector {
      display: flex; align-items: center; justify-content: center; gap: 16px;
      margin-bottom: 16px; font-size: 15px;
    }
    .month-selector button { font-size: 20px; color: var(--accent); padding: 4px 8px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card {
      background: var(--bg2); border-radius: var(--radius); padding: 14px 12px;
      border: 1px solid var(--border);
    }
    .stat-card.wide { grid-column: span 2; }
    .stat-card.accent { border-color: var(--accent); }
    .stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; line-height: 1; }
    .stat-value.big { font-size: 32px; }
    .stat-value.green { color: var(--green); }
    .stat-value.amber { color: var(--accent); }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }
    .inventory-row { display: flex; gap: 8px; margin-top: 8px; }
    .inventory-badge {
      flex: 1; text-align: center; padding: 6px 4px;
      background: var(--bg3); border-radius: var(--radius-sm);
    }
    .inventory-badge .badge-num { font-size: 18px; font-weight: 700; }
    .inventory-badge .badge-label { font-size: 10px; color: var(--text2); }

    /* ===== PRODUCT CARD ===== */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-title { font-size: 15px; font-weight: 600; }
    .filter-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      white-space: nowrap; font-size: 12px; padding: 5px 12px;
      border-radius: 20px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border);
      transition: all .2s;
    }
    .filter-tab.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
    .product-list { display: flex; flex-direction: column; gap: 10px; }
    .product-card {
      background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border);
      display: flex; gap: 12px; padding: 12px; cursor: pointer;
      transition: border-color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .product-card:active { border-color: var(--accent); }
    .product-thumb {
      width: 68px; height: 68px; border-radius: var(--radius-sm);
      background: var(--bg3); flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      color: var(--text3); font-size: 28px;
    }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-store { font-size: 12px; color: var(--text2); margin-bottom: 6px; }
    .product-row { display: flex; align-items: center; justify-content: space-between; }
    .product-cost { font-size: 13px; color: var(--text2); }
    .product-profit { font-size: 14px; font-weight: 700; }
    .product-profit.positive { color: var(--green); }
    .product-profit.negative { color: var(--red); }
    .status-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    }
    .status-badge.unlisted { background: rgba(240,165,0,.15); color: var(--accent); }
    .status-badge.listed   { background: rgba(91,156,246,.15); color: var(--blue); }
    .status-badge.sold     { background: rgba(62,207,142,.15); color: var(--green); }
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* ===== FAB ===== */
    .fab {
      position: fixed; bottom: calc(24px + var(--safe-bottom)); right: 20px; z-index: 200;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--accent); color: #111; font-size: 28px; font-weight: 300;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(240,165,0,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .fab:active { transform: scale(.94); box-shadow: 0 2px 10px rgba(240,165,0,.3); }

    /* ===== BOTTOM SHEET ===== */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 300; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 430px;
      background: var(--bg2); border-radius: 20px 20px 0 0;
      z-index: 301; transition: transform .3s cubic-bezier(.32,1.2,.8,1);
      max-height: 92dvh; display: flex; flex-direction: column;
    }
    .sheet.show { transform: translateX(-50%) translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
    }
    .sheet-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; flex-shrink: 0;
    }
    .sheet-title { font-size: 17px; font-weight: 700; }
    .sheet-close { font-size: 22px; color: var(--text2); padding: 4px; }
    .sheet-body { overflow-y: auto; padding: 0 16px calc(20px + var(--safe-bottom)); flex: 1; }
    .form-group { margin-bottom: 16px; }
    .form-label { font-size: 13px; color: var(--text2); margin-bottom: 6px; display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-actions { display: flex; gap: 10px; padding: 12px 16px calc(12px + var(--safe-bottom)); flex-shrink: 0; border-top: 1px solid var(--border); }
    .btn {
      flex: 1; padding: 14px; border-radius: var(--radius); font-size: 15px; font-weight: 600;
      transition: opacity .15s;
    }
    .btn:active { opacity: .8; }
    .btn-primary { background: var(--accent); color: #111; }
    .btn-secondary { background: var(--bg3); color: var(--text); }
    .btn-danger { background: rgba(240,96,96,.15); color: var(--red); border: 1px solid rgba(240,96,96,.3); }

    /* ===== PHOTO UPLOAD ===== */
    .photo-upload-area {
      display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; padding-bottom: 4px;
    }
    .photo-upload-area::-webkit-scrollbar { display: none; }
    .photo-thumb-wrap {
      position: relative; flex-shrink: 0; width: 80px; height: 80px;
    }
    .photo-thumb-wrap img {
      width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-sm);
    }
    .photo-remove {
      position: absolute; top: -6px; right: -6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--red); color: #fff; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }
    .photo-add-btn {
      flex-shrink: 0; width: 80px; height: 80px; border-radius: var(--radius-sm);
      background: var(--bg3); border: 2px dashed var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--text3); font-size: 24px; gap: 2px;
    }
    .photo-add-btn span { font-size: 10px; }

    /* ===== STATUS SELECT ===== */
    .status-select { display: flex; gap: 8px; }
    .status-option {
      flex: 1; padding: 10px 4px; border-radius: var(--radius-sm);
      border: 2px solid var(--border); text-align: center; font-size: 12px; font-weight: 600;
      transition: all .15s; cursor: pointer; color: var(--text2);
    }
    .status-option.selected.unlisted { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,.1); }
    .status-option.selected.listed   { border-color: var(--blue);   color: var(--blue);   background: rgba(91,156,246,.1); }
    .status-option.selected.sold     { border-color: var(--green);  color: var(--green);  background: rgba(62,207,142,.1); }

    /* ===== DETAIL SHEET ===== */
    .detail-photos {
      display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px;
    }
    .detail-photos::-webkit-scrollbar { display: none; }
    .detail-photos img {
      width: 140px; height: 140px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0;
    }
    .detail-section { margin-bottom: 20px; }
    .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
    .detail-row:last-child { border-bottom: none; }
    .detail-key { color: var(--text2); }
    .detail-val { font-weight: 600; text-align: right; }
    .detail-profit-box {
      background: var(--bg3); border-radius: var(--radius); padding: 16px;
      text-align: center; margin-bottom: 16px;
    }
    .detail-profit-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
    .detail-profit-val { font-size: 36px; font-weight: 700; }

    /* ===== SOLD MODAL QUICK ===== */
    .sold-status-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .sold-status-btn {
      flex: 1; padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
      background: var(--bg3); border: 2px solid var(--border); color: var(--text2); transition: all .15s;
    }
    .sold-status-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(240,165,0,.1); }

    /* ===== CSV / EXPORT ===== */
    .settings-section { margin-bottom: 24px; }
    .settings-section-title { font-size: 12px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .settings-row {
      background: var(--bg2); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
    }
    .settings-item {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s;
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:active { background: var(--bg3); }
    .settings-icon { font-size: 20px; width: 28px; text-align: center; }
    .settings-text { flex: 1; }
    .settings-title { font-size: 15px; }
    .settings-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .settings-arrow { color: var(--text3); }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg3); color: var(--text); padding: 10px 20px;
      border-radius: 20px; font-size: 14px; z-index: 500;
      opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== MISC ===== */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    #fileInput { display: none; }
    #importInput { display: none; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <h1>🛍 キリリンSHOP</h1>
  <div class="header-actions">
    <button class="icon-btn" onclick="showSheet('settingsSheet')" title="設定">⚙️</button>
  </div>
</header>

<!-- TAB NAV -->
<nav class="tab-nav">
  <button class="active" onclick="switchTab('dashboard', this)">📊 ダッシュボード</button>
  <button onclick="switchTab('inventory', this)">📦 在庫</button>
  <button onclick="switchTab('sold', this)">✅ 販売済み</button>
</nav>

<!-- DASHBOARD -->
<main class="page active" id="page-dashboard">
  <div class="month-selector">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="monthLabel"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
</main>

<!-- INVENTORY -->
<main class="page" id="page-inventory">
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all', this)">すべて</button>
    <button class="filter-tab" onclick="setFilter('unlisted', this)">未出品</button>
    <button class="filter-tab" onclick="setFilter('listed', this)">出品済み</button>
  </div>
  <div class="product-list" id="inventoryList"></div>
</main>

<!-- SOLD -->
<main class="page" id="page-sold">
  <div class="filter-tabs" style="margin-bottom:12px">
    <button class="filter-tab active" onclick="setSoldFilter('all', this)">すべて</button>
    <button class="filter-tab" onclick="setSoldFilter('thisMonth', this)">今月</button>
    <button class="filter-tab" onclick="setSoldFilter('lastMonth', this)">先月</button>
  </div>
  <div class="product-list" id="soldList"></div>
</main>

<!-- FAB -->
<button class="fab" onclick="openAddForm()">＋</button>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="closeAllSheets()"></div>

<!-- ====== ADD / EDIT SHEET ====== -->
<div class="sheet" id="formSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="formTitle">商品を登録</span>
    <button class="sheet-close" onclick="closeSheet('formSheet')">×</button>
  </div>
  <div class="sheet-body">
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handlePhotos(event)" />

    <div class="form-group">
      <label class="form-label">📸 商品写真</label>
      <div class="photo-upload-area" id="photoArea">
        <button type="button" class="photo-add-btn" onclick="document.getElementById('fileInput').click()">
          ＋<span>追加</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">📌 ステータス</label>
      <div class="status-select" id="statusSelect">
        <button type="button" class="status-option unlisted selected" onclick="selectStatus('unlisted')">未出品</button>
        <button type="button" class="status-option listed" onclick="selectStatus('listed')">出品済み</button>
        <button type="button" class="status-option sold" onclick="selectStatus('sold')">販売済み</button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">🏷 商品名 / メモ</label>
      <input type="text" id="fName" placeholder="例：古着 デニムジャケット M" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">🏪 仕入れ店舗</label>
        <input type="text" id="fStore" placeholder="例：オフハウス" />
      </div>
      <div class="form-group">
        <label class="form-label">💴 仕入額（円）</label>
        <input type="number" id="fCost" placeholder="0" inputmode="numeric" />
      </div>
    </div>

    <div id="soldFields">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">💰 販売額（円）</label>
          <input type="number" id="fSalePrice" placeholder="0" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label class="form-label">📅 販売日</label>
          <input type="date" id="fSoldAt" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">🔖 手数料（円）</label>
          <input type="number" id="fFee" placeholder="0" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label class="form-label">📦 送料（円）</label>
          <input type="number" id="fShipping" placeholder="0" inputmode="numeric" />
        </div>
      </div>
    </div>

    <div id="deleteSection" style="display:none; margin-top:8px;">
      <div class="divider"></div>
      <button class="btn btn-danger" style="width:100%" onclick="deleteCurrentItem()">🗑 この商品を削除</button>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-secondary" onclick="closeSheet('formSheet')">キャンセル</button>
    <button class="btn btn-primary" onclick="saveItem()">保存</button>
  </div>
</div>

<!-- ====== DETAIL SHEET ====== -->
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title">商品詳細</span>
    <button class="sheet-close" onclick="closeSheet('detailSheet')">×</button>
  </div>
  <div class="sheet-body" id="detailBody"></div>
  <div class="form-actions">
    <button class="btn btn-secondary" onclick="closeSheet('detailSheet')">閉じる</button>
    <button class="btn btn-primary" id="detailEditBtn">編集</button>
  </div>
</div>

<!-- ====== SETTINGS SHEET ====== -->
<div class="sheet" id="settingsSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title">⚙️ 設定 / データ管理</span>
    <button class="sheet-close" onclick="closeSheet('settingsSheet')">×</button>
  </div>
  <div class="sheet-body">
    <div class="settings-section">
      <div class="settings-section-title">データ</div>
      <div class="settings-row">
        <div class="settings-item" onclick="exportJSON()">
          <span class="settings-icon">📤</span>
          <div class="settings-text">
            <div class="settings-title">JSONエクスポート</div>
            <div class="settings-desc">全データをバックアップ</div>
          </div>
          <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item" onclick="document.getElementById('importInput').click()">
          <span class="settings-icon">📥</span>
          <div class="settings-text">
            <div class="settings-title">JSONインポート</div>
            <div class="settings-desc">バックアップから復元</div>
          </div>
          <span class="settings-arrow">›</span>
        </div>
        <div class="settings-item" onclick="exportCSV()">
          <span class="settings-icon">📊</span>
          <div class="settings-text">
            <div class="settings-title">CSVエクスポート</div>
            <div class="settings-desc">帳簿・マネフォ用</div>
          </div>
          <span class="settings-arrow">›</span>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">アプリ情報</div>
      <div class="settings-row">
        <div class="settings-item">
          <span class="settings-icon">ℹ️</span>
          <div class="settings-text">
            <div class="settings-title">キリリンSHOP v1.0</div>
            <div class="settings-desc">中古アパレルせどり管理アプリ</div>
          </div>
        </div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--text3);text-align:center;margin-top:8px;">データはこの端末のブラウザに保存されます</p>
  </div>
</div>

<input type="file" id="importInput" accept=".json" onchange="importJSON(event)" />

<script>
// =====================
//  STATE
// =====================
let items = [];
let currentStatus = 'unlisted';
let editingId = null;
let formPhotos = []; // base64 strings
let currentFilter = 'all';
let currentSoldFilter = 'all';
let viewMonth = new Date();
viewMonth.setDate(1);

const STATUS_LABEL = { unlisted: '未出品', listed: '出品済み', sold: '販売済み' };
const STORAGE_KEY = 'kiririn_items_v2';

// =====================
//  STORAGE
// =====================
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) { showToast('⚠️ 保存失敗（容量不足の可能性）'); }
}
function load() {
  try { items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { items = []; }
}

// =====================
//  TAB
// =====================
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'inventory') renderInventory();
  if (tab === 'sold') renderSold();
}

// =====================
//  SHEETS
// =====================
function showSheet(id) {
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}
function closeSheet(id) {
  document.getElementById(id).classList.remove('show');
  // hide overlay only if no other sheet open
  const anyOpen = [...document.querySelectorAll('.sheet.show')].length > 0;
  if (!anyOpen) document.getElementById('overlay').classList.remove('show');
}
function closeAllSheets() {
  document.querySelectorAll('.sheet.show').forEach(s => s.classList.remove('show'));
  document.getElementById('overlay').classList.remove('show');
}

// =====================
//  TOAST
// =====================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// =====================
//  FORM
// =====================
function openAddForm() {
  editingId = null;
  formPhotos = [];
  currentStatus = 'unlisted';
  document.getElementById('formTitle').textContent = '商品を登録';
  document.getElementById('fName').value = '';
  document.getElementById('fStore').value = '';
  document.getElementById('fCost').value = '';
  document.getElementById('fSalePrice').value = '';
  document.getElementById('fFee').value = '';
  document.getElementById('fShipping').value = '';
  document.getElementById('fSoldAt').value = '';
  document.getElementById('deleteSection').style.display = 'none';
  renderStatusSelect();
  renderPhotoArea();
  toggleSoldFields();
  showSheet('formSheet');
}

function openEditForm(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingId = id;
  formPhotos = item.photos ? [...item.photos] : [];
  currentStatus = item.status || 'unlisted';
  document.getElementById('formTitle').textContent = '商品を編集';
  document.getElementById('fName').value = item.name || '';
  document.getElementById('fStore').value = item.store || '';
  document.getElementById('fCost').value = item.cost || '';
  document.getElementById('fSalePrice').value = item.salePrice || '';
  document.getElementById('fFee').value = item.fee || '';
  document.getElementById('fShipping').value = item.shipping || '';
  document.getElementById('fSoldAt').value = item.soldAt ? item.soldAt.split('T')[0] : '';
  document.getElementById('deleteSection').style.display = 'block';
  renderStatusSelect();
  renderPhotoArea();
  toggleSoldFields();
  closeSheet('detailSheet');
  showSheet('formSheet');
}

function selectStatus(s) {
  currentStatus = s;
  renderStatusSelect();
  toggleSoldFields();
}

function renderStatusSelect() {
  document.querySelectorAll('#statusSelect .status-option').forEach(btn => {
    btn.classList.toggle('selected', btn.classList.contains(currentStatus));
  });
}

function toggleSoldFields() {
  document.getElementById('soldFields').style.display = currentStatus === 'sold' ? 'block' : 'none';
}

function renderPhotoArea() {
  const area = document.getElementById('photoArea');
  area.innerHTML = '';
  formPhotos.forEach((src, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap';
    const img = document.createElement('img');
    img.src = src;
    const rm = document.createElement('button');
    rm.className = 'photo-remove';
    rm.textContent = '×';
    rm.onclick = () => { formPhotos.splice(i, 1); renderPhotoArea(); };
    wrap.append(img, rm);
    area.append(wrap);
  });
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'photo-add-btn';
  addBtn.innerHTML = '＋<span>追加</span>';
  addBtn.onclick = () => document.getElementById('fileInput').click();
  area.append(addBtn);
}

function handlePhotos(e) {
  const files = [...e.target.files];
  let loaded = 0;
  files.forEach(f => {
    const reader = new FileReader();
    reader.onload = ev => {
      formPhotos.push(ev.target.result);
      loaded++;
      if (loaded === files.length) renderPhotoArea();
    };
    reader.readAsDataURL(f);
  });
  e.target.value = '';
}

function saveItem() {
  const name    = document.getElementById('fName').value.trim();
  const store   = document.getElementById('fStore').value.trim();
  const cost    = parseFloat(document.getElementById('fCost').value) || 0;
  const salePrice = parseFloat(document.getElementById('fSalePrice').value) || 0;
  const fee     = parseFloat(document.getElementById('fFee').value) || 0;
  const shipping= parseFloat(document.getElementById('fShipping').value) || 0;
  const soldAtRaw= document.getElementById('fSoldAt').value;
  const soldAt  = soldAtRaw ? new Date(soldAtRaw).toISOString() : null;
  const profit  = currentStatus === 'sold' ? salePrice - cost - fee - shipping : null;

  if (!name && !store && cost === 0) { showToast('商品名・店舗・仕入額のいずれかを入力してください'); return; }

  if (editingId) {
    const idx = items.findIndex(i => i.id === editingId);
    if (idx !== -1) {
      items[idx] = { ...items[idx], status: currentStatus, name, store, cost, photos: formPhotos,
        salePrice: currentStatus === 'sold' ? salePrice : items[idx].salePrice,
        fee: currentStatus === 'sold' ? fee : items[idx].fee,
        shipping: currentStatus === 'sold' ? shipping : items[idx].shipping,
        soldAt: currentStatus === 'sold' ? (soldAt || items[idx].soldAt) : null,
        profit,
        listedAt: currentStatus === 'listed' && !items[idx].listedAt ? new Date().toISOString() : items[idx].listedAt,
      };
    }
    showToast('✅ 更新しました');
  } else {
    items.unshift({
      id: Date.now().toString(),
      status: currentStatus,
      name, store, cost,
      photos: formPhotos,
      createdAt: new Date().toISOString(),
      listedAt: currentStatus === 'listed' ? new Date().toISOString() : null,
      soldAt,
      salePrice: currentStatus === 'sold' ? salePrice : 0,
      fee: currentStatus === 'sold' ? fee : 0,
      shipping: currentStatus === 'sold' ? shipping : 0,
      profit,
    });
    showToast('✅ 登録しました');
  }

  save();
  closeSheet('formSheet');
  renderAll();
}

function deleteCurrentItem() {
  if (!editingId) return;
  if (!confirm('この商品を削除しますか？')) return;
  items = items.filter(i => i.id !== editingId);
  save();
  closeSheet('formSheet');
  showToast('🗑 削除しました');
  renderAll();
}

// =====================
//  DETAIL
// =====================
function openDetail(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;

  const profit = item.profit ?? (item.status === 'sold' ? item.salePrice - item.cost - item.fee - item.shipping : null);
  const stockDays = calcStockDays(item);

  let html = '';

  // Photos
  if (item.photos && item.photos.length) {
    html += '<div class="detail-photos">';
    item.photos.forEach(src => { html += `<img src="${src}" alt="" />`; });
    html += '</div>';
  }

  // Status badge
  html += `<div style="margin-bottom:14px"><span class="status-badge ${item.status}">${STATUS_LABEL[item.status]}</span></div>`;

  // Profit box (sold only)
  if (item.status === 'sold' && profit !== null) {
    const pColor = profit >= 0 ? 'var(--green)' : 'var(--red)';
    const margin = item.salePrice ? ((profit / item.salePrice) * 100).toFixed(1) : 0;
    html += `<div class="detail-profit-box">
      <div class="detail-profit-label">利益</div>
      <div class="detail-profit-val" style="color:${pColor}">${fmt(profit)}</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">利益率 ${margin}%</div>
    </div>`;
  }

  html += '<div class="detail-section">';
  html += row('商品名', item.name || '—');
  html += row('店舗', item.store || '—');
  html += row('仕入額', fmt(item.cost));
  if (item.status === 'sold') {
    html += row('販売額', fmt(item.salePrice));
    html += row('手数料', fmt(item.fee));
    html += row('送料', fmt(item.shipping));
    html += row('販売日', item.soldAt ? dateStr(item.soldAt) : '—');
  }
  html += row('登録日', item.createdAt ? dateStr(item.createdAt) : '—');
  html += row('在庫日数', stockDays + '日');
  html += '</div>';

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('detailEditBtn').onclick = () => openEditForm(id);
  showSheet('detailSheet');
}

function row(k, v) {
  return `<div class="detail-row"><span class="detail-key">${k}</span><span class="detail-val">${v}</span></div>`;
}

function fmt(n) { return '¥' + (Number(n) || 0).toLocaleString(); }
function dateStr(iso) { const d = new Date(iso); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function calcStockDays(item) {
  const start = item.createdAt ? new Date(item.createdAt) : new Date();
  const end   = item.soldAt ? new Date(item.soldAt) : new Date();
  return Math.max(0, Math.floor((end - start) / 86400000));
}

// =====================
//  RENDER DASHBOARD
// =====================
function renderDashboard() {
  const label = `${viewMonth.getFullYear()}年${viewMonth.getMonth()+1}月`;
  document.getElementById('monthLabel').textContent = label;

  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const soldMonth  = items.filter(i => i.status === 'sold' && i.soldAt && new Date(i.soldAt).getFullYear()===y && new Date(i.soldAt).getMonth()===m);
  const soldYear   = items.filter(i => i.status === 'sold' && i.soldAt && new Date(i.soldAt).getFullYear()===y);
  const inStock    = items.filter(i => i.status !== 'sold');
  const unlisted   = items.filter(i => i.status === 'unlisted');
  const listed     = items.filter(i => i.status === 'listed');
  const sold       = items.filter(i => i.status === 'sold');

  const monthProfit   = soldMonth.reduce((s,i) => s + (i.profit ?? 0), 0);
  const monthIncome   = soldMonth.reduce((s,i) => s + (i.salePrice ?? 0), 0);
  const totalCost     = inStock.reduce((s,i) => s + (i.cost ?? 0), 0);
  const yearProfit    = soldYear.reduce((s,i) => s + (i.profit ?? 0), 0);
  const allSold       = items.filter(i => i.status === 'sold');
  const profitMargin  = monthIncome > 0 ? ((monthProfit / monthIncome) * 100).toFixed(1) : '—';
  const turnover      = items.length > 0 ? ((allSold.length / items.length) * 100).toFixed(1) : '—';

  const g = document.getElementById('statsGrid');
  g.innerHTML = `
    <div class="stat-card accent wide">
      <div class="stat-label">📈 月利（${label}）</div>
      <div class="stat-value big ${monthProfit >= 0 ? 'green' : ''}">${fmt(monthProfit)}</div>
      <div class="stat-sub">販売${soldMonth.length}件 / 売上 ${fmt(monthIncome)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">💳 月入金額</div>
      <div class="stat-value amber">${fmt(monthIncome)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">💴 仕入総額</div>
      <div class="stat-value">${fmt(totalCost)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">📊 利益率</div>
      <div class="stat-value ${profitMargin !== '—' ? 'green' : ''}">${profitMargin !== '—' ? profitMargin + '%' : '—'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🔄 回転率</div>
      <div class="stat-value">${turnover !== '—' ? turnover + '%' : '—'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🗓 年間総利益</div>
      <div class="stat-value ${yearProfit >= 0 ? 'green' : ''}">${fmt(yearProfit)}</div>
    </div>
    <div class="stat-card wide">
      <div class="stat-label">📦 在庫状況</div>
      <div class="inventory-row">
        <div class="inventory-badge">
          <div class="badge-num" style="color:var(--text)">${inStock.length}</div>
          <div class="badge-label">在庫合計</div>
        </div>
        <div class="inventory-badge">
          <div class="badge-num" style="color:var(--accent)">${unlisted.length}</div>
          <div class="badge-label">未出品</div>
        </div>
        <div class="inventory-badge">
          <div class="badge-num" style="color:var(--blue)">${listed.length}</div>
          <div class="badge-label">出品済み</div>
        </div>
        <div class="inventory-badge">
          <div class="badge-num" style="color:var(--green)">${sold.length}</div>
          <div class="badge-label">販売済み</div>
        </div>
      </div>
    </div>
  `;
}

function changeMonth(delta) {
  viewMonth.setMonth(viewMonth.getMonth() + delta);
  renderDashboard();
}

// =====================
//  RENDER INVENTORY
// =====================
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('#page-inventory .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderInventory();
}

function renderInventory() {
  let list = items.filter(i => i.status !== 'sold');
  if (currentFilter !== 'all') list = list.filter(i => i.status === currentFilter);
  const el = document.getElementById('inventoryList');
  if (!list.length) { el.innerHTML = emptyState('商品がありません', '右下の＋ボタンから登録しましょう'); return; }
  el.innerHTML = list.map(i => productCard(i)).join('');
}

function setSoldFilter(f, btn) {
  currentSoldFilter = f;
  document.querySelectorAll('#page-sold .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSold();
}

function renderSold() {
  let list = items.filter(i => i.status === 'sold');
  if (currentSoldFilter === 'thisMonth') {
    const now = new Date(); list = list.filter(i => i.soldAt && new Date(i.soldAt).getFullYear()===now.getFullYear() && new Date(i.soldAt).getMonth()===now.getMonth());
  } else if (currentSoldFilter === 'lastMonth') {
    const lm = new Date(); lm.setMonth(lm.getMonth()-1);
    list = list.filter(i => i.soldAt && new Date(i.soldAt).getFullYear()===lm.getFullYear() && new Date(i.soldAt).getMonth()===lm.getMonth());
  }
  list = list.sort((a,b) => new Date(b.soldAt||0) - new Date(a.soldAt||0));
  const el = document.getElementById('soldList');
  if (!list.length) { el.innerHTML = emptyState('販売済み商品なし', ''); return; }
  el.innerHTML = list.map(i => productCard(i)).join('');
}

function productCard(item) {
  const profit = item.profit ?? 0;
  const thumb = (item.photos && item.photos[0])
    ? `<img src="${item.photos[0]}" alt="" loading="lazy" />`
    : '👕';
  const profitHtml = item.status === 'sold'
    ? `<span class="product-profit ${profit >= 0 ? 'positive' : 'negative'}">${fmt(profit)}</span>`
    : `<span style="font-size:12px;color:var(--text3)">仕入 ${fmt(item.cost)}</span>`;
  return `
    <div class="product-card" onclick="openDetail('${item.id}')">
      <div class="product-thumb">${thumb}</div>
      <div class="product-info">
        <div class="product-name">${esc(item.name || '（名称未設定）')}</div>
        <div class="product-store">${esc(item.store || '')} <span class="status-badge ${item.status}">${STATUS_LABEL[item.status]}</span></div>
        <div class="product-row">
          ${item.status !== 'sold' ? `<span class="product-cost">仕入 ${fmt(item.cost)}</span>` : `<span class="product-cost">${item.soldAt ? dateStr(item.soldAt) : ''}</span>`}
          ${profitHtml}
        </div>
      </div>
    </div>`;
}

function emptyState(title, sub) {
  return `<div class="empty-state"><div class="empty-icon">📭</div><div style="font-size:15px;margin-bottom:4px">${title}</div><div style="font-size:13px">${sub}</div></div>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderAll() {
  renderDashboard();
  const activeTab = document.querySelector('.tab-nav button.active');
  if (activeTab) {
    const txt = activeTab.textContent;
    if (txt.includes('在庫')) renderInventory();
    if (txt.includes('販売')) renderSold();
  }
}

// =====================
//  EXPORT / IMPORT
// =====================
function exportJSON() {
  const data = JSON.stringify(items, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kiririn_backup_${dateTag()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 エクスポート完了');
}

function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data)) throw new Error('invalid');
      if (!confirm(`${data.length}件のデータをインポートします。現在のデータに追加しますか？`)) return;
      // merge by id
      const existingIds = new Set(items.map(i => i.id));
      const newItems = data.filter(i => !existingIds.has(i.id));
      items = [...items, ...newItems];
      save();
      renderAll();
      showToast(`✅ ${newItems.length}件インポートしました`);
    } catch {
      showToast('⚠️ ファイルが無効です');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function exportCSV() {
  const headers = ['登録日','販売日','商品名','仕入れ店舗','仕入額','販売額','手数料','送料','利益','ステータス','在庫日数'];
  const rows = items.map(i => {
    const profit = i.status === 'sold' ? (i.salePrice - i.cost - i.fee - i.shipping) : '';
    return [
      i.createdAt ? dateStr(i.createdAt) : '',
      i.soldAt    ? dateStr(i.soldAt) : '',
      i.name || '',
      i.store || '',
      i.cost || 0,
      i.salePrice || '',
      i.fee || '',
      i.shipping || '',
      profit,
      STATUS_LABEL[i.status] || '',
      calcStockDays(i),
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
  });
  const csv = '﻿' + [headers.join(','), ...rows].join('\n'); // BOM for Excel
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `kiririn_${dateTag()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📊 CSVエクスポート完了');
}

function dateTag() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

// =====================
//  INIT
// =====================
load();
renderDashboard();
renderInventory();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(() => {});
}
